<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>VISUAL-009 — Seven-Hub hop 768 headers</title>
  <style>
    :root { font-family: Inter, system-ui, sans-serif; color: #0A2540; background: #F8FAFC; }
    body { margin: 24px; }
    h1 { font-size: 26px; }
    p { max-width: 920px; line-height: 1.45; color: #1E293B; }
    .col { display: flex; flex-direction: column; gap: 8px; }
    figure { margin: 0; background: #fff; border: 1px solid #E2E8F0; border-radius: 8px; overflow: hidden; }
    figcaption { padding: 6px 10px; font-size: 12px; font-weight: 700; letter-spacing: 0.04em; border-top: 1px solid #E2E8F0; }
    img { display: block; width: 100%; image-rendering: auto; }
    .note { font-size: 13px; }
  </style>
</head>
<body>
  <h1>VISUAL-009 production hop — 768 headers</h1>
  <p class="note">Identical Playwright viewport, DPR=1, same crop origin (0,0). Do not scale independently. Order: Ask → Move → Lender → Insurance → Contractor → Senior → Investor.</p>
  <div class="col">
    <figure><img src="headers/ask-768.png" alt="ASK" /><figcaption>ASK</figcaption></figure>
    <figure><img src="headers/move-768.png" alt="MOVE" /><figcaption>MOVE</figcaption></figure>
    <figure><img src="headers/lender-768.png" alt="LENDER" /><figcaption>LENDER</figcaption></figure>
    <figure><img src="headers/insurance-768.png" alt="INSURANCE" /><figcaption>INSURANCE</figcaption></figure>
    <figure><img src="headers/contractor-768.png" alt="CONTRACTOR" /><figcaption>CONTRACTOR</figcaption></figure>
    <figure><img src="headers/senior-768.png" alt="SENIOR" /><figcaption>SENIOR</figcaption></figure>
    <figure><img src="headers/investor-768.png" alt="INVESTOR" /><figcaption>INVESTOR</figcaption></figure>
  </div>
</body>
</html>
