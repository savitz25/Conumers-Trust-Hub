<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"/><title>VISUAL-009 navigator</title><style>
:root { font-family: Inter, system-ui, sans-serif; color: #0A2540; background: #F8FAFC; }
body { margin: 20px; }
h1 { font-size: 24px; }
.note { color: #334155; max-width: 960px; line-height: 1.45; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.frame { position: relative; background: #fff; border: 1px solid #E2E8F0; border-radius: 8px; overflow: hidden; }
.frame img { display: block; width: 100%; }
.guide-h { position: absolute; left: 0; right: 0; height: 0; border-top: 1px dashed; pointer-events: none; }
.guide-v { position: absolute; top: 0; bottom: 0; width: 0; border-left: 1px dashed; pointer-events: none; }
.cap { padding: 6px 10px; font-size: 12px; font-weight: 700; border-top: 1px solid #E2E8F0; }
table { border-collapse: collapse; background: #fff; width: 100%; font-size: 12px; }
th, td { border: 1px solid #E2E8F0; padding: 6px 8px; text-align: left; }
.ok { font-weight: 700; }
.grid7 { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
</style></head><body>

<figure class="frame"><img src="navigator/senior-1440.jpg" alt="senior navigator"/><figcaption class="cap">SENIOR</figcaption></figure>
<figure class="frame"><img src="navigator/investor-1440.jpg" alt="investor navigator"/><figcaption class="cap">INVESTOR</figcaption></figure>
