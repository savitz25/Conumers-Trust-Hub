<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>AskTrustHub — VISUAL-002 before / after</title>
  <style>
    body { margin: 0; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #0a2540; color: #fff; }
    h1 { font-size: 22px; padding: 24px 24px 8px; }
    .note { padding: 0 24px 24px; color: #cbd5e1; max-width: 800px; }
    .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 0 24px 32px; }
    figure { margin: 0; background: #132a4a; border-radius: 12px; overflow: hidden; }
    figcaption { padding: 10px 12px; font-size: 13px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: #94a3b8; }
    img { width: 100%; display: block; background: #fff; }
    @media (max-width: 900px) { .pair { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <h1>OLD ASK vs NEW ASK</h1>
  <p class="note">Desktop 1440 and mobile 390. Production before vs VISUAL-002 reference shell. Open this file to judge — do not rely on Markdown.</p>
  <div class="pair">
    <figure>
      <figcaption>Before · desktop 1440</figcaption>
      <img src="before/desktop-1440.jpg" alt="Ask homepage before desktop" />
    </figure>
    <figure>
      <figcaption>After · desktop 1440</figcaption>
      <img src="after/desktop-1440.jpg" alt="Ask homepage after desktop" />
    </figure>
  </div>
  <div class="pair">
    <figure>
      <figcaption>After · Network Navigator open</figcaption>
      <img src="after/desktop-switch.jpg" alt="Switch Hub panel after" />
    </figure>
    <figure>
      <figcaption>After · desktop header crop</figcaption>
      <img src="after/header-desktop.png" alt="Header after" />
    </figure>
  </div>
  <div class="pair">
    <figure>
      <figcaption>Before · mobile 390</figcaption>
      <img src="before/mobile-390.jpg" alt="Ask homepage before mobile" />
    </figure>
    <figure>
      <figcaption>After · mobile 390</figcaption>
      <img src="after/mobile-390.jpg" alt="Ask homepage after mobile" />
    </figure>
  </div>
  <div class="pair">
    <figure>
      <figcaption>After · mobile drawer</figcaption>
      <img src="after/mobile-drawer.jpg" alt="Mobile drawer after" />
    </figure>
    <figure>
      <figcaption>After · drawer network section</figcaption>
      <img src="after/mobile-network.jpg" alt="Mobile Switch Hub section" />
    </figure>
  </div>
</body>
</html>
